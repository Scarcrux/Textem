name: release

# Cut a release by pushing a version tag, e.g. `git tag v0.1.0 && git push --tags`.
# Produces a DRAFT GitHub Release with the .dmg attached (review, then publish).
# This CI artifact is an UNSIGNED TEST BUILD and must not be published as the
# public release: it has no Developer ID signature, no notarization and no
# embedded Textem Codes AutoFill extension. The public release is the signed,
# notarized build from Experiments/NativeAutoFill/signed-build.sh (see
# DEVELOPING.md); attach that DMG to the release instead.
# Manual only. Publishing a v* tag must NOT trigger this: the real release
# attaches the signed, notarized Textem.dmg, and this job would upload an
# unsigned Textem.dmg under the same name into that same release.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build + test
        run: xcrun --toolchain XcodeDefault swift test

      - name: Package .dmg
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"; [[ "$version" =~ ^[0-9] ]] || version=0.0.0
          version="${version%%-*}"
          make dmg VERSION="$version" BUILD_NUMBER="${GITHUB_RUN_NUMBER}"
          shasum -a 256 Textem.dmg > Textem.dmg.sha256

      - name: Report what this build lacks
        shell: bash
        run: |
          if [ -d Textem.app/Contents/PlugIns/TextemCodeProvider.appex ]; then
            echo "AutoFill extension present"
          else
            echo "::warning::CI build has no TextemCodeProvider.appex (AutoFill) and is unsigned; do not publish it as the release."
          fi

      - name: Publish draft release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          draft: true
          tag_name: ci-test-${{ github.run_number }}
          prerelease: true
          name: Textem ${{ github.ref_name }} (CI unsigned test build)
          files: |
            Textem.dmg
            Textem.dmg.sha256
          body: |
            CI UNSIGNED TEST BUILD of Textem ${{ github.ref_name }} — not the public release.

            It is not signed or notarized (Gatekeeper will block it) and does not
            include the Textem Codes AutoFill extension. Replace this asset with the
            signed, notarized DMG from the release process in DEVELOPING.md before
            publishing.
