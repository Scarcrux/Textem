name: release

# Cut a release by pushing a version tag, e.g. `git tag v0.1.0 && git push --tags`.
# Produces a DRAFT GitHub Release with the .dmg attached (review, then publish).
# Signing/notarization can be added later via repo secrets + `make release`.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build + test
        run: xcrun --toolchain XcodeDefault swift test

      - name: Package .dmg
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          version="${version%%-*}"
          make dmg VERSION="$version" BUILD_NUMBER="${GITHUB_RUN_NUMBER}"
          shasum -a 256 Textem.dmg > Textem.dmg.sha256

      - name: Publish draft release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          draft: true
          name: Textem ${{ github.ref_name }}
          files: |
            Textem.dmg
            Textem.dmg.sha256
          body: |
            Unsigned pre-release build of Textem ${{ github.ref_name }}.

            macOS Gatekeeper will warn on first launch (right-click → Open,
            or System Settings → Privacy & Security → Open Anyway). Signed +
            notarized builds will follow once a Developer ID is configured.
