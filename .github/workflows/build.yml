name: build

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Show Swift version
        run: swift --version

      - name: Test
        run: xcrun --toolchain XcodeDefault swift test

      - name: Bundle Textem.app
        run: make bundle
